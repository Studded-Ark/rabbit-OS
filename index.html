<!DOCTYPE html>
<html>
    <body style = "background: url(ras.png); background-size:cover; height:100vh; margin: 0px; overflow: hidden;
    font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">
        <!--TOP BAR-->
        <div id = "topbar" style = "display:flex; justify-content: space-between; margin: 16px; border-radius: 16px;
        background-color: rgba(0,0,0,0.66); backdrop-filter: blur(8px);">
            <div id = "landingopen"  style = "cursor: pointer; display:flex; justify-content: center; flex-direction: row;">
                <img src = "Area_Moonlit_Pinnacle.png" style = "height:50%; transform: translateY(50%)">
                <h3 style = "color: white; margin-top: 24px">
                    rabbitOS
                </h3>
            </div>
            <h3 style = "color: white; margin-top: 24px">
                STEEL YOURSELF!
            </h3>
            <div>
                <p id = "timeElementA" style = "color: white; margin-right: 16px ; margin-top: 16px;">
                    Time
                </p>
                <p id = "timeElementB" style = "color: white; margin-right: 16px; margin-top: -16px;">
                    Date
                </p>
            </div>
        </div>
        <!--APP BAR-->
        <div id = "appbar" style = "position: absolute; bottom:0; left:0; right:0; padding-top: 24px;
        display:flex; justify-content: center; flex-direction: row; text-align: center; margin: 16px; border-radius: 16px;
        background-color: rgba(0,0,0,0.66); backdrop-filter: blur(8px);">
            <!--WIKI-->
            <div>
                <img src = "Trinket_Floof_ball.png" id = "wikiopen" class = "app">
                <p style = "color:white">Wiki</p>
            </div>
        </div>
         <!--LANDING-->
        <div class = "window" id = "landing" style = "width: 500px; height:270px">
            <div class = "windowtopbar" id = "landingtopbar">
                <p class = "windowname">Welcome</p>
                <p class = "closebutton" id = "landingclose" >X</p>
            </div>
            <h1 style = "color: white; margin-left: 16px">
                rabbitOS
            </h1>
            <h3 style = "color: white; margin-left: 16px">
                STEEL YOURSELF!
            </h3>
            <p style = "color: white; margin-left: 16px">
                A <a href="https://store.steampowered.com/app/2132850/Rabbit_and_Steel/" style = "color: rgb(135, 44, 255)">Rabbit and Steel</a> themed WebOS.
            </p>
            <p style = "color: white; margin-left: 16px; margin-right: 40%">
                Rabbit and Steel is a roguelike/bullet hell game made by mino_dev.
            </p>
            <img src = "asha.png" style = "height: 75%; transform: translate(140%,-100%)"></img>
        </div>
        <!--WIKI-->
        <div class = "window" id = "wiki" style = "width: calc(75% - 100px); height: calc(75% - 100px); display: none;">
            <div class = "windowtopbar" id = "wikitopbar">
                <div style="display:flex; flex-direction:row; justify-content: space-between;">
                    <img src="Trinket_Floof_ball.png" style="height: fit-content;">
                    <p class = "windowname">Fandom Wiki</p>
                </div>
                <p class = "closebutton" id = "wikiclose" >X</p>
            </div>
            <iframe src="https://rabbitandsteel.fandom.com/wiki/Rabbit_and_Steel_Wiki" style="width:100%; height:calc(100% - 48px)"></iframe>
        </div>

        <script src = "script.js"></script>
        <link rel = "stylesheet" type = "text/css" href = "style.css"/>
    </body>
</html>
