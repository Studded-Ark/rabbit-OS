<!DOCTYPE html>
<html>
    <body style = "background-color: black; background-size:cover; height:100vh; margin: 0px; overflow: hidden;
    font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; color: white">
        <!--TOP BAR-->
        <div id = "topbar" style = "display:flex; justify-content: space-between; margin: 16px; border-radius: 16px;
        background-color: rgba(0,0,0,0.5);">
            <div id = "landingopen"  style = "cursor: pointer; display:flex; justify-content: center; flex-direction: row;">
                <img src = "apps/welcome/Area_Moonlit_Pinnacle.png" style = "height:50%; transform: translateY(50%)">
                <h3 style = "margin-top: 24px">
                    rabbitOS
                </h3>
            </div>
            <h3 style = "margin-top: 24px">
                STEEL YOURSELF!
            </h3>
            <div>
                <p id = "timeElementA" style = "margin-right: 16px ; margin-top: 16px;">
                    Time
                </p>
                <p id = "timeElementB" style = "margin-right: 16px; margin-top: -16px;">
                    Date
                </p>
            </div>
        </div>
        <!--APP BAR-->
        <div id = "appbar" style = "position: absolute; bottom:0; left:0; right:0; padding-top: 16px;
        display:flex; justify-content: center; flex-direction: row; text-align: center; margin-bottom: 16px; border-radius: 16px;
        background-color: rgba(0,0,0,0.5); width:fit-content; transform: translateX(calc(50vw - 50%));">
            <!--WIKI-->
            <div>
                <img src = "apps/wiki/Trinket_Floof_ball.png" id = "wikiopen" class = "app">
                <p>Wiki</p>
            </div>
            <!--SYSTEM-->
            <div>
                <img src = "apps/system/Gear-icon.png" id = "systemopen" class = "app">
                <p>System</p>
            </div>
        </div>
         <!--LANDING-->
        <div class = "window" id = "landing" style = "width: 500px; height: 350px;">
            <div class = "windowtopbar" id = "landingtopbar">
                <p class = "windowname">Welcome</p>
                <p class = "closebutton" id = "landingclose" >X</p>
            </div>
            <div style = "display: flex; justify-content: space-between;">
                <div>
                    <h1 style = "margin-left: 16px; margin-right: -32px">
                        rabbitOS
                    </h1>
                    <h3 style = "margin-left: 16px; margin-right: -32px">
                        STEEL YOURSELF!
                    </h3>
                    <p style = "margin-left: 16px; margin-right: -32px">
                        A <a href="https://store.steampowered.com/app/2132850/Rabbit_and_Steel/" style = "color: rgb(44, 128, 255)">Rabbit and Steel</a> themed WebOS.
                    </p>
                    <p style = "margin-left: 16px; margin-right: -32px">
                        Rabbit and Steel is a roguelike/bullet hell game made by mino_dev.
                    </p>
                </div>
                <img src = "apps/welcome/asha.png" style = "height:300px;"></img>
            </div>
        </div>
        <!--WIKI-->
        <div class = "window" id = "wiki" style = "width: calc(75% - 100px); height: calc(75% - 100px); min-width: 500px; min-height: 300px; display: none;">
            <div class = "windowtopbar" id = "wikitopbar">
                <div style="display:flex; flex-direction:row; justify-content: space-between;">
                    <img src="apps/wiki/Trinket_Floof_ball.png" style="height: fit-content;">
                    <p class = "windowname">Fandom Wiki</p>
                </div>
                <p class = "closebutton" id = "wikiclose" >X</p>
            </div>
            <iframe src="https://rabbitandsteel.fandom.com/wiki/Rabbit_and_Steel_Wiki" style="width:100%; height:calc(100% - 48px)"></iframe>
        </div>
        <!--SYSTEM-->
        <div class = "window" id = "system" style = "width: calc(50% - 100px); height: calc(75% - 100px); min-width: 825px; min-height: 600px;  display: none;">
            <div class = "windowtopbar" id = "systemtopbar">
                <div style="display:flex; flex-direction:row; justify-content: space-between;">
                    <img src="apps/system/Gear-icon.png" style="height: fit-content;">
                    <p class = "windowname">System Settings</p>
                </div>
                <p class = "closebutton" id = "systemclose" >X</p>
            </div>
            <h3 style = "margin-left: 16px;">Background</h3>
            <div style = "margin-left: 16px; margin-right: 16px; display: block;">
                <img id = "Kingdom_Outskirts" src = "apps/system/background-icons/Kingdom_Outskirts.png" style = "cursor: pointer">
                <img id = "Scholars_Nest" src = "apps/system/background-icons/Scholars_Nest.png" style = "cursor: pointer">
                <img id = "Kings_Arsenal" src = "apps/system/background-icons/Kings_Arsenal.png" style = "cursor: pointer">
                <img id = "Red_Darkhouse" src = "apps/system/background-icons/Red_Darkhouse.png" style = "cursor: pointer">
                <img id = "Churchmouse_Streets" src = "apps/system/background-icons/Churchmouse_Streets.png" style = "cursor: pointer">
                <img id = "Emerald_Lakeside" src = "apps/system/background-icons/Emerald_Lakeside.png" style = "cursor: pointer">
                <img id = "The_Pale_Keep" src = "apps/system/background-icons/The_Pale_Keep.png" style = "cursor: pointer">
                <img id = "Moonlit_Pinnacle" src = "apps/system/background-icons/Moonlit_Pinnacle.png" style = "cursor: pointer">
                <img id = "Crack_In_The_Geode" src = "apps/system/background-icons/Crack_In_The_Geode.png" style = "cursor: pointer">
                <img id = "Darkhouse_Depths" src = "apps/system/background-icons/Darkhouse_Depths.png" style = "cursor: pointer">
                <img id = "Atelier_Aurum" src = "apps/system/background-icons/Atelier_Aurum.png" style = "cursor: pointer">
                <img id = "Subterra_Sanctum" src = "apps/system/background-icons/Subterra_Sanctum.png" style = "cursor: pointer">
                <img id = "Looping_Hallway" src = "apps/system/background-icons/Looping_Hallway.png" style = "cursor: pointer">
                <img id = "Reflecting_Pool" src = "apps/system/background-icons/Reflecting_Pool.png" style = "cursor: pointer">
            </div>
            <h3 style = "margin-left: 16px;">Settings</h3>
            <div style = "margin-left: 16px; margin-right: 16px; display: block;">
                <p id="blur" style = "cursor: pointer">Blur: On</p>
            </div>
            <div style = "margin-left: 16px; margin-right: 16px; display: block;">
                <p id="dropshadow" style = "cursor: pointer">Drop Shadow: On</p>
            </div>
        </div>

        <script src = "script.js"></script>
        <link rel = "stylesheet" type = "text/css" href = "style.css"/>
    </body>
</html>
